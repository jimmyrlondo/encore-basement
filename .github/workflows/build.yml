name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only the two top-level submodules (Tracktion's own nested JUCE uses an SSH address)
      - name: Fetch JUCE and Tracktion Engine
        run: git submodule update --init --depth 1 external/JUCE external/tracktion_engine

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # The 32-bit plugin bridge: its own 32-bit build, then beside Encore Studio.exe
      - name: Build the 32-bit plugin bridge
        shell: pwsh
        run: |
          cmake -B build32 -A Win32 -DSTUDIO_BRIDGE_ONLY=ON
          cmake --build build32 --config Release --parallel
          Copy-Item "build32/EncoreStudioBridge32_artefacts/Release/Encore Studio Bridge32.exe" "build/EncoreStudio_artefacts/Release/"

      - name: Self-test
        shell: pwsh
        run: |
          $exe = "build/EncoreStudio_artefacts/Release/Encore Studio.exe"
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content (Join-Path $dir "selftest.log")
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build/EncoreStudio_artefacts/Release/Encore Studio.exe", "build/EncoreStudio_artefacts/Release/Encore Studio Bridge32.exe", LICENSE, README.md dist/
          Compress-Archive dist/* Encore-Studio-windows.zip

      # The installer (Inno Setup): Start menu + desktop shortcuts, opens .encore songs, uninstaller
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(EncoreStudio VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" installer/EncoreStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
          Get-ChildItem dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-Studio-windows
          path: |
            Encore-Studio-windows.zip
            dist/Encore-Studio-*-windows-setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Encore-Studio-windows.zip
            dist/Encore-Studio-*-windows-setup.exe
          prerelease: true
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and Tracktion Engine
        run: git submodule update --init --depth 1 external/JUCE external/tracktion_engine

      # One app for Apple Silicon and Intel Macs
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Self-test
        run: |
          app="build/EncoreStudio_artefacts/Release/Encore Studio.app"
          dir="$RUNNER_TEMP/selftest"
          "$app/Contents/MacOS/Encore Studio" --selftest "$dir" &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "self-test timed out"; exit 1; fi
          wait $pid; code=$?
          cat "$dir/selftest.log"
          exit $code

      - name: Package
        run: |
          mkdir dist
          cp -R "build/EncoreStudio_artefacts/Release/Encore Studio.app" dist/
          cp LICENSE README.md dist/
          cd dist && ditto -c -k --sequesterRsrc . ../Encore-Studio-macos.zip

      # The Mac installer: a disk image to drag Encore Studio into Applications
      - name: Disk image
        run: |
          version=$(sed -nE 's/^project\(EncoreStudio VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)
          mkdir dmg
          cp -R "build/EncoreStudio_artefacts/Release/Encore Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Encore Studio" -srcfolder dmg -ov -format UDZO "Encore-Studio-$version-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-Studio-macos
          path: |
            Encore-Studio-macos.zip
            Encore-Studio-*-macos.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Encore-Studio-macos.zip
            Encore-Studio-*-macos.dmg
          prerelease: true
